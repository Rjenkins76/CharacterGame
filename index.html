<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101b18">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Unity Web Player | Tales of the Lantern Road</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Tales of the Lantern Road</div>
      </div>
    </div>
    <div id="unity-launch-overlay" class="launch-overlay" role="dialog" aria-modal="true" aria-labelledby="launch-title">
      <div class="launch-card">
        <div class="launch-eyebrow">TALES OF THE LANTERN ROAD</div>
        <h1 id="launch-title">Your story awaits</h1>
        <p id="launch-description">Start the game in full screen for the best experience.</p>
        <button id="unity-launch-button" type="button" disabled>Preparing the game…</button>
        <div id="launch-note">The game will enter full screen after you start it.</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");
      let unityInstance = null;
      const launchOverlay = document.querySelector("#unity-launch-overlay");
      const launchButton = document.querySelector("#unity-launch-button");
      const launchDescription = document.querySelector("#launch-description");
      const launchNote = document.querySelector("#launch-note");
      const browserCanFullscreen = Boolean(document.fullscreenEnabled || document.webkitFullscreenEnabled || document.msFullscreenEnabled);

      if (!browserCanFullscreen) {
        launchDescription.textContent = "Start the game. This browser will keep it inside its window.";
        launchNote.textContent = "Use your browser's full screen control if you want a larger view.";
      }

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "Tales of the Lantern Road",
        productName: "Tales of the Lantern Road",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        autoSyncPersistentDataPath: true,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // autoSyncPersistentDataPath is enabled above so character records survive
      // a browser restart when the user keeps this site's stored data.

      const isTouchDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
        (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);

      if (isTouchDevice) {
        // Fill the available mobile browser area and cap pixel density to reduce GPU load.
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

        const updateMobileViewportHeight = () => {
          const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          document.documentElement.style.setProperty("--mobile-viewport-height", height + "px");
        };
        updateMobileViewportHeight();
        window.addEventListener("resize", updateMobileViewportHeight, { passive: true });
        if (window.visualViewport)
          window.visualViewport.addEventListener("resize", updateMobileViewportHeight, { passive: true });


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((instance) => {
                unityInstance = instance;
                launchButton.disabled = false;
                launchButton.textContent = browserCanFullscreen ? "ENTER FULL SCREEN" : "START GAME";
                launchButton.focus();

                // Fullscreen must be requested directly from a user gesture in modern browsers.
                launchButton.onclick = () => {
                  if (!unityInstance) return;
                  try {
                    unityInstance.SetFullscreen(1);
                  } catch (error) {
                    console.warn("The browser could not enter full screen:", error);
                  }
                  launchOverlay.style.display = "none";
                };

                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
